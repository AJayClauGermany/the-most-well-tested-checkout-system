# Settings for the JUnit Platform (read by every engine: Jupiter, jqwik, Cucumber).
# Run tests in parallel. This is Tier 3 of the testing matrix: it proves that the tests
# are independent of each other (no shared state, no fixed order). Each test class and each
# test method may run on its own thread.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Cucumber: read the scenarios with the long names ("Feature - Scenario") in reports,
# and do not advertise the Cucumber Reports service after every run.
cucumber.junit-platform.naming-strategy=long
cucumber.publish.quiet=true
cucumber.plugin=pretty

# jqwik keeps the seeds of failed properties here so it can retry them first next time.
jqwik.database=target/.jqwik-database
